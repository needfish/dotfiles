[settings]
auto_update = true
# Honor .node-version / .nvmrc files in project dirs (per-project Node pinning).
idiomatic_version_file_enable_tools = ["node"]
# Authenticate GitHub API calls for version lookups via the gh CLI.
github.credential_command = "gh auth token"

[tools]
# --- Reproducibility: pin exact versions. Bump deliberately. ---
node = "26.8.2"
neovim = "0.12.3"

# pnpm via the aqua backend (standalone release binary).
# NOT `npm:pnpm`: pnpm >=12 ships a native ELF binary that mise's npm-shim
# imports as JS and crashes with a SyntaxError. aqua fetches the real release.
"aqua:pnpm/pnpm" = "12.4.1"

# Global JS CLI tools via mise (instead of `npm i -g ...`), so they are
# recreated by `mise install` on every machine and survive Node upgrades.
"npm:@earendil-works/pi-coding-agent" = "0.85.1"
uv = "latest"
chezmoi = "latest"
rust = "latest"
go = "latest"
docker-cli = "latest"
docker-compose = "latest"
"aqua:k3s-io/k3s" = { version = "latest", os = ["linux"] }
# Headlamp ships .dmg/.deb assets the github backend can't match; install via
# brew on macOS, linuxbrew on Linux.
"github:kubernetes-sigs/headlamp" = { version = "latest", os = ["linux"] }

# Formatters and linters for Neovim (conform.nvim, nvim-lint).
stylua = "latest"
shfmt = "latest"
shellcheck = "latest"
ruff = "latest"
terraform = "latest"
"cargo:selene" = "latest"
"npm:prettier" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:eslint" = "latest"

# Kubernetes and cloud CLIs.
kubectl = "latest"
helm = "latest"
argocd = "latest"
kustomize = "latest"
yq = "latest"
aws-cli = "latest"

# Shell navigation, Kubernetes helpers, and system inspection.
broot = { version = "latest", os = ["linux"] }
ripgrep = "latest"
fd = "latest"
fzf = "latest"
zoxide = "latest"
eza = "latest"
bat = "latest"
delta = "latest"
atuin = "latest"
lazygit = "latest"
stern = "latest"
kubectx = "latest"
kubens = "latest"
lazydocker = "latest"
direnv = "latest"
just = "latest"
dust = "latest"
duf = "latest"
btop = { version = "latest", os = ["linux"] }
