[settings]
auto_update = true
# Honor .node-version / .nvmrc files in project dirs (per-project Node pinning).
idiomatic_version_file_enable_tools = ["node"]
# Authenticate GitHub API calls for version lookups via the gh CLI.
github.credential_command = "gh auth token"

[tools]
# --- Reproducibility: pin exact versions. Bump deliberately. ---
node = "26.9.0"

# pnpm via the aqua backend (standalone release binary).
# NOT `npm:pnpm`: pnpm >=12 ships a native ELF binary that mise's npm-shim
# imports as JS and crashes with a SyntaxError. aqua fetches the real release.
"aqua:pnpm/pnpm" = "12.5.1"

# Global JS CLI tools via mise (instead of `npm i -g ...`), so they are
# recreated by `mise install` on every machine and survive Node upgrades.
"npm:@earendil-works/pi-coding-agent" = "0.86.0"
uv = "latest"
chezmoi = "latest"
rust = "latest"
go = "latest"
"aqua:k3s-io/k3s" = "latest"
"github:kubernetes-sigs/headlamp" = "latest"

# Formatters and linters for Neovim (conform.nvim, nvim-lint).
stylua = "latest"
shfmt = "latest"
shellcheck = "latest"
ruff = "latest"
terraform = "latest"
"cargo:selene" = "latest"
"npm:prettier" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:eslint" = "latest"

# Kubernetes and cloud CLIs.
kubectl = "latest"
helm = "latest"
argocd = "latest"
kustomize = "latest"
yq = "latest"
aws-cli = "latest"

# Shell navigation, Kubernetes helpers, and system inspection.
broot = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
zoxide = "latest"
eza = "latest"
bat = "latest"
delta = "latest"
atuin = "latest"
lazygit = "latest"
stern = "latest"
kubectx = "latest"
kubens = "latest"
direnv = "latest"
just = "latest"
dust = "latest"
duf = "latest"
btop = "latest"
sqlite = "latest"
"github:can1357/oh-my-pi" = "latest"
k3d = "latest"
java = "27"
maven = "3"
ansible-core = "latest"
